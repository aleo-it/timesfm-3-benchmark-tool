[project]
name = "forecasting-lab"
version = "0.1.0"
description = "Benchmark comparing TimesFM 3.0 against traditional forecasting models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "scikit-learn>=1.3",
    # Models
    "timesfm>=3.0.1",  # provides the timesfm3 module
    "prophet>=1.1",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    # Datasets
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
forecast-bench = "benchmark.run:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
